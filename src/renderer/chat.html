<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Simon Twitch – Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <button type="button" id="account"></button>
    <div class="segmented" role="group" aria-label="Chat-Ansicht">
      <button type="button" id="mode-single" title="Ein Chat groß, Wechsel über die Tabs">Ein Chat</button>
      <button type="button" id="mode-split" title="Alle Chats gleichzeitig (Splitscreen)">Splitscreen</button>
    </div>
  </div>
  <div class="chats" id="chats"></div>
  <div class="empty" id="empty">
    <h2>Kein Chat</h2>
    <div>Sobald im Stream-Fenster ein Stream läuft, erscheint hier sein Chat.</div>
  </div>
  <script src="common.js"></script>
  <script src="chat.js"></script>
</body>
</html>
