name: Build

# Baut bei jedem Push die Windows-.exe und die Linux-Pakete.
# Ein GitHub-Release mit allen Dateien entsteht, wenn ein Tag wie "v0.1.0" gepusht wird
# oder der Workflow manuell (Actions → Build → Run workflow) mit "release" gestartet wird.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub-Release mit der Version aus package.json erstellen'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows
            files: |
              dist/*.exe
          - os: ubuntu-latest
            script: dist:linux
            name: linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Paket bauen
        run: npm run ${{ matrix.script }}
        env:
          # Keine Code-Signatur (kein Zertifikat vorhanden)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: simon-twitch-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Version lesen
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: An GitHub-Release anhängen
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Simon Twitch ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          files: ${{ matrix.files }}
          generate_release_notes: true
