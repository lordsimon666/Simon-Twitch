name: Build

# Baut bei jedem Push die Windows-.exe und die Linux-Pakete.
# Ein GitHub-Release mit allen Dateien entsteht, wenn ein Tag wie "v0.1.0" gepusht wird
# oder der Workflow manuell (Actions → Build → Run workflow) mit "release" gestartet wird.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub-Release mit der Version aus package.json erstellen'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows
            files: |
              dist/*.exe
          - os: ubuntu-latest
            script: dist:linux
            name: linux
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/*.flatpak
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Flatpak (Bazzite, SteamOS, alle Distributionen) braucht eigene Werkzeuge
      - name: Flatpak-Werkzeuge installieren
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Handbuchseiten-Index nicht neu bauen (kann apt minutenlang aufhalten)
          sudo rm -f /var/lib/man-db/auto-update
          for i in 1 2 3; do
            sudo timeout 180 apt-get -o Acquire::Retries=3 update && \
            sudo timeout 300 apt-get -o Acquire::Retries=3 install -y --no-install-recommends flatpak flatpak-builder && break
            echo "apt fehlgeschlagen (Versuch $i), neuer Versuch …"; sleep 10
          done
          command -v flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Paket bauen
        run: npm run ${{ matrix.script }}
        env:
          # Keine Code-Signatur (kein Zertifikat vorhanden)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: simon-twitch-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Version lesen
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: An GitHub-Release anhängen
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Simon Twitch ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          files: ${{ matrix.files }}
          # Nur ein Job erzeugt die Release-Notizen, sonst stehen sie doppelt drin
          generate_release_notes: ${{ matrix.name == 'linux' }}

  # Die .rpm (Fedora, Bazzite) wird in einem echten Fedora-System gebaut –
  # rpmbuild unter Ubuntu kommt mit dem Paket nicht zurecht.
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Werkzeuge installieren
        run: dnf install -y nodejs npm git rpm-build findutils

      - uses: actions/checkout@v4

      - run: npm ci

      - name: Paket bauen
        run: npm run dist:rpm

      - name: Als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: simon-twitch-fedora
          path: dist/*.rpm
          if-no-files-found: error

      - name: Version lesen
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: An GitHub-Release anhängen
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Simon Twitch ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          files: dist/*.rpm
